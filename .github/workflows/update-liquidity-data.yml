name: Update Liquidity Data

on:
  # Ejecutar todos los días a las 02:00 UTC (después del cierre de mercados US)
  schedule:
    - cron: '0 2 * * *'

  # Permitir ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data update script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd liquidity_dashboard
          python src/update_data.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain liquidity_dashboard/data/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add liquidity_dashboard/data/
          git commit -m "📊 Auto-update liquidity data - $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "ℹ️ No changes in data files, skipping commit"
