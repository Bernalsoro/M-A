[theme]
# Corporate Investment Banking theme
primaryColor = "#003366"        # Navy blue - professional, trustworthy
backgroundColor = "#FFFFFF"      # Clean white background
secondaryBackgroundColor = "#F5F7FA"  # Light grey for sections
textColor = "#1A1A1A"           # Near-black for readability
font = "sans serif"             # Clean, professional font

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
